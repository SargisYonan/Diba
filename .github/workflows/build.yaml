name: Build and test

on: [push, pull_request]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install toolchain
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
      - name: Build fonts
        run: python -m fontmake -g sources/Ganta.glyphs -o ttf otf --output-dir fonts
      - name: Shaping tests
        run: python scripts/shape_test.py fonts/Ganta-Regular.ttf
      - name: Proof
        run: python scripts/proof.py fonts/Ganta-Regular.ttf -o out/proof.html
      - name: fontbakery
        run: fontbakery check-universal --loglevel WARN fonts/Ganta-Regular.ttf || true
      - uses: actions/upload-artifact@v4
        with:
          name: ganta-fonts
          path: |
            fonts/
            out/proof.html
