# Builds Diba from sources/Diba.glyphs and checks it on every push and pull
# request. The job fails if QA finds an error, a test fails, or fontbakery
# reports a failure. The fonts, proofs and reports are attached to each run.
name: Font QA

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  qa:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: requirements.txt

      - name: Build, QA, tests, fontbakery, proofs
        run: make ci

      - name: Summary
        if: always()
        run: |
          {
            echo "## QA"
            echo '```'
            venv/bin/python qa/check.py 2>&1 | tail -n 30 || true
            echo '```'
            for f in out/fontbakery-*.txt; do
              echo "## fontbakery: $(basename "$f" .txt | sed 's/^fontbakery-//')"
              echo '```'
              cat "$f"
              echo '```'
            done
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload font, proofs and reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: diba-qa
          path: |
            fonts/Diba-Regular.ttf
            fonts/Diba-Regular.otf
            out/proof.html
            out/qa.json
            out/fontbakery-*.html
            out/fontbakery-*.txt
            documentation/*.svg
